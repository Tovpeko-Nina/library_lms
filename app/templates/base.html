<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}LMS — Цифровая библиотека{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css?v=0.1.1-ui12">
</head><body>
<header class="topbar"><div class="wrap nav-wrap">
<a class="brand" href="/">LMS</a>
<nav class="nav-main"><a href="/books">Каталог</a><a href="/docs">API Docs</a></nav>
<div class="nav-user"><a id="nav-dashboard" class="hidden" href="/dashboard">Кабинет</a><a id="nav-admin" class="hidden" href="/admin">Управление</a><span id="nav-user-name" class="user-name"></span><a id="nav-login" class="btn btn-light" href="/login">Войти</a><a id="nav-register" class="btn btn-primary" href="/register">Регистрация</a><button id="nav-logout" class="btn btn-light hidden" onclick="LMS.logout()">Выйти</button></div>
</div></header>
<div id="toast" class="toast"></div>
<main>{% block content %}{% endblock %}</main>
<footer><div class="wrap">Library Management System · FastAPI · <a href="/docs">REST API</a></div></footer>
<script src="/static/js/main.js?v=0.1.1-ui12"></script>{% block scripts %}{% endblock %}
</body></html>
