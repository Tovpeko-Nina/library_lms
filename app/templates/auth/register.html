{% extends 'base.html' %}{% block title %}Регистрация — LMS{% endblock %}{% block content %}
<section class="auth-page"><div class="auth-card wide"><div class="eyebrow">LMS</div><h1>Создать аккаунт</h1><p class="muted">Регистрация доступна студентам и сотрудникам. После регистрации аккаунт ожидает верификации.</p><form id="register-form" onsubmit="return LMS.register(event)"><div class="form-grid"><label>Имя<input id="first_name" required></label><label>Фамилия<input id="last_name" required></label><label>Логин<input id="reg_login" required maxlength="50"></label><label>Email<input id="email" type="email" required></label><label>Пароль<input id="reg_password" type="password" minlength="12" maxlength="72" required><small class="muted">От 12 символов, не более 72 байт</small></label><label>Тип пользователя<select id="role"><option value="STUDENT">Студент</option><option value="EMPLOYEE">Сотрудник</option></select></label></div><button class="btn btn-primary btn-lg full" type="submit">Зарегистрироваться</button></form><div id="register-result" class="result hidden"></div><div class="auth-note">Уже есть аккаунт? <a href="/login">Войти</a></div></div></section>
{% endblock %}
