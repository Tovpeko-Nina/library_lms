services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lms_test
      POSTGRES_USER: lms_test
      POSTGRES_PASSWORD: lms-test-password
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_test -d lms_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"
