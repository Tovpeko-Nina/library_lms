services:
  library-lms:
    build: .
    container_name: library-lms
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "change-me-in-production"
    volumes:
      # SQLite database is stored on the host and survives container recreation.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
