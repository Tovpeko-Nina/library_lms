[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-config --strict-markers -ra
markers =
    unit: быстрый тест без подключения к внешним сервисам
    integration: тест с отдельной PostgreSQL
    api: проверка HTTP-контракта FastAPI
    migration: проверка последовательного обновления схемы PostgreSQL
    requirement(id): связь теста с идентификатором требования
