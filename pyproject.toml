[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    # FastAPI intentionally declares dependencies by calling Depends in defaults.
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "migrations"]
skips = []

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
# Обязательный локальный порог покрытия из требований ЛР3.
# Его нельзя снижать или исключать файлы без обоснования в Pull Request.
fail_under = 40

[tool.coverage.html]
directory = "reports/coverage-html"

[tool.coverage.xml]
output = "reports/coverage.xml"
